# Dual arm: both arms raise together, alternate, then flap symmetrically at the sides.
# arm_b's joint1 and joint6 axes are flipped in the URDF, so the same values on both
# arms give mirror-image poses.
name: dual_arm
title: Dual-arm routine
description: Both arms raise together, alternate up and down, then flap at the sides.

parameters:
  repetitions: {type: int, default: 2, min: 1, max: 20, help: repetitions of each part}

poses:
  forward: {both_arms: [0.0, -1.57, 0.0, 0.0, 1.57, 0.01]}   # arms straight forward
  up: {both_arms: [0.0, -2.7, 0.0, 0.0, 1.57, 0.01]}         # arms raised high
  sides: {both_arms: [1.3, -1.57, 0.0, 0.0, 1.57, 0.01]}     # arms straight out (T pose)

steps:
  - move: forward
    label: both arms forward
  - repeat: repetitions
    steps:
      - move: up
        label: "simultaneous raise {i}/{repetitions}"
      - move: forward
  - oscillate:
      amplitude: {arm_a_joint2: 0.5, arm_b_joint2: 0.5}
      phase: {arm_b_joint2: pi}             # half a cycle apart: one up, one down
      cycles: repetitions
    label: "alternating arms x{repetitions}"
  - move: sides
    label: arms out to the sides
  - oscillate:
      amplitude: {arm_a_joint2: 0.4, arm_b_joint2: 0.4}
      cycles: repetitions
    label: "symmetric flaps x{repetitions}"
  - move: home
    label: back to home
