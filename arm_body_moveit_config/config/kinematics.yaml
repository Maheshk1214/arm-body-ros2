# Joints 2-5 of each arm all rotate about parallel axes, so the arm has only 5 task-space DOF
# (Jacobian rank 5 everywhere): most 6-D pose goals are unreachable. Solve for position only;
# the end-effector orientation is whatever the solver lands on.
arm_a:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
arm_b:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
