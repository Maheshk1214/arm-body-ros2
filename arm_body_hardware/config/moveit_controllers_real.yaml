# MoveIt controllers for the real arms, served by feetech_bridge (no ros2_control).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_a_controller
    - arm_b_controller
    - gripper_a_controller
    - gripper_b_controller

  arm_a_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_a_joint1
      - arm_a_joint2
      - arm_a_joint3
      - arm_a_joint4
      - arm_a_joint5
      - arm_a_joint6
  arm_b_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_b_joint1
      - arm_b_joint2
      - arm_b_joint3
      - arm_b_joint4
      - arm_b_joint5
      - arm_b_joint6
  gripper_a_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_a_gripper_joint
  gripper_b_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_b_gripper_joint
